name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install

      - name: Prepare module
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm vitest run test/unit/

      - name: Build
        run: pnpm run prepack

      - name: Extract release notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME} " 'index($0, heading) == 1 { found = 1; next } found && /^## v/ { exit } found { print }' CHANGELOG.md > release-notes.md
          test -n "$(tr -d '[:space:]' < release-notes.md)"

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
